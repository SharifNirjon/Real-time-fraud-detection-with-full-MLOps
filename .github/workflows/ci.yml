name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install
        run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts && black --check src tests scripts
      - name: Tests (synthetic fixture data, no Kaggle download)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          tags: fraud-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build pipelines image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pipelines
          tags: fraud-pipelines:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test serving image (imports only)
        run: docker run --rm fraud-api:ci python -c "import fraud.serve.app, fraud.model; print('ok')"
